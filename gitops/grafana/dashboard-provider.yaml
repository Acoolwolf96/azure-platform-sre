apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: platform
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: false
        editable: false
        updateIntervalSeconds: 10
        options:
          path: /etc/grafana/dashboards
