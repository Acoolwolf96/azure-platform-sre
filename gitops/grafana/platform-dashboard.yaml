apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-platform-dashboard
data:
  platform-sre.json: |
    {
      "uid": "platform-sre",
      "title": "Platform SRE Overview",
      "tags": ["platform", "sre", "jobs"],
      "timezone": "browser",
      "schemaVersion": 41,
      "refresh": "15s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Jobs Submitted",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "jobs_api_jobs_submitted_total",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Jobs Completed",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "worker_jobs_completed_total",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Jobs Failed",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(worker_jobs_failed_total) or vector(0)",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Worker Ready",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "worker_ready",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "NOT READY"
                    },
                    "1": {
                      "text": "READY"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "API Request Rate",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (method, path, status) (rate(jobs_api_http_requests_total[5m]))",
              "legendFormat": "{{method}} {{path}} {{status}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "API p95 Latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, path) (rate(jobs_api_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Worker Processing p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(worker_job_processing_duration_seconds_bucket[5m])))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Prometheus Target Health",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "up{job=~\"jobs-api|worker\"}",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          }
        }
      ]
    }
