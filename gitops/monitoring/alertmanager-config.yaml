apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      receiver: platform-alerts
      group_by:
        - alertname
        - severity
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 4h

    receivers:
      - name: platform-alerts
