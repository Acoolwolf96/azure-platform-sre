apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: worker
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Acoolwolf96/azure-platform-sre.git
    targetRevision: main
    path: gitops/worker

  destination:
    server: https://kubernetes.default.svc
    namespace: jobs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
